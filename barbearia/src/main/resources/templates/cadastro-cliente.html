<!-- cadastro.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Cliente</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <link rel="stylesheet" href="/css/cadastro.css">
  
</head>

<body>
  <div class="container">
    <h2><i class="fas fa-user-plus"></i> Cadastro de Cliente</h2>
    <form th:action="@{/clientes/cadastrar}" th:object="${cliente}" method="post">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" th:field="*{nome}" required>
      <div class="error-message" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" th:field="*{telefone}" required>
      <div class="error-message" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>

      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" required>
      <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      <div class="error-message" th:if="${erroEmail != null}" th:text="${erroEmail}"></div>

      <label for="senha">Senha</label>
      <input type="password" id="senha" th:field="*{senha}" required>
      <div class="error-message" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>

      <button type="submit" class="btn"><i class="fas fa-user-check"></i> Cadastrar</button>
    </form>

    <div class="link">
      Já tem uma conta? <a th:href="@{/clientes/login}">Faça login</a>
    </div>

    <div th:if="${param.cadastroSucesso}" class="success-message">
      Cadastro realizado com sucesso!
    </div>
  </div>
</body>
</html>
