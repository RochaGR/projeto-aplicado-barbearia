<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartao Fidelidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/fidelidade.css}">
</head>
<body>
<div class="container-fidelidade">
    <nav class="navbar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <a href="/" class="logo">
            <i class="fas fa-cut"></i>
            <span>Barbearia Souza</span>
        </a>

        <div class="nav-buttons" id="nav-buttons">
            <div sec:authorize="isAuthenticated() && !hasRole('ADMIN') && !hasRole('BARBEIRO')">
                <a th:href="@{/agendamentos/novo}" class="nav-btn">Novo Agendamento</a>
                <a th:href="@{/agendamentos}" class="nav-btn">Meus Agendamentos</a>
                <a th:href="@{/cliente/historico}" class="nav-btn">Historico</a>
                <a th:href="@{/cliente/fidelidade}" class="nav-btn">Fidelidade</a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="nav-btn">Sair</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="fidelidade-wrapper">
        <div class="cartao-fidelidade">
            <h2><i class="fas fa-star"></i> Meu Cartao Fidelidade</h2>

            <div class="pontos-progress">
                <span th:each="i : ${#numbers.sequence(1, config.cortesParaDesconto)}"
                      th:class="${i <= cartao.pontos} ? 'ponto ativo' : 'ponto'">
                    <i class="fas fa-cut"></i>
                </span>
            </div>

            <p class="progresso" th:text="${cartao.pontos + '/' + config.cortesParaDesconto + ' cortes'}"></p>
            <p class="total-cortes" th:text="'Total de cortes concluidos: ' + ${cartao.totalCortesRealizados}"></p>

            <div th:if="${temDesconto}" class="alert-desconto">
                <i class="fas fa-ticket-alt"></i>
                <span>Voce tem <strong th:text="${percentualDesconto} + '%'">40%</strong> de desconto no proximo agendamento.</span>
            </div>

            <div th:unless="${temDesconto}" class="alert-sem-desconto">
                Continue concluindo agendamentos para liberar seu desconto.
            </div>
        </div>
    </main>
</div>
</body>
</html>
