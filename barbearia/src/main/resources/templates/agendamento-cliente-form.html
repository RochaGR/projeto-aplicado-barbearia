<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Agendamento - Barbearia Souza</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="/css/agendamento.css">


</head>

<body>
<!-- Navbar -->
<nav class="navbar">
    <a th:href="@{/}" class="logo">
        <i class="fas fa-cut"></i>
        <span>Barbearia Souza</span>
    </a>
    <a th:href="@{/}" class="nav-link">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>

</nav>


<!-- Page Title -->
<h1 class="page-title">
    <i class="fas fa-calendar-check"></i> Agende seu Horário
</h1>

<!-- Main Container -->
<div class="container">
    <div class="header">
        <h4><i class="fas fa-calendar-plus"></i> Novo Agendamento</h4>
    </div>

    <div class="form-container">
        <form th:action="@{/agendamentos/salvar}" th:object="${agendamento}" method="post" id="appointment-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group" id="service-group">
                <label for="servico">
                    <i class="fas fa-cut"></i> Escolha seu corte
                </label>
                <div class="input-container">
                    <i class="fas fa-scissors input-icon"></i>
                    <select id="servico" th:field="*{servico.id}" required>
                        <option value="">-- Selecione o serviço --</option>
                        <option th:each="servico : ${servicos}"
                                th:value="${servico.id}"
                                th:text="${servico.nome + ' - R$ ' + #numbers.formatDecimal(servico.preco, 1, 2)}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group" id="barber-group">
                <label for="barbeiro">
                    <i class="fas fa-user-tie"></i> Escolha seu barbeiro
                </label>
                <div class="input-container">
                    <i class="fas fa-user input-icon"></i>
                    <select id="barbeiro" th:field="*{barbeiro.id}" required>
                        <option value="">-- Selecione o barbeiro --</option>
                        <option th:each="barbeiro : ${barbeiros}"
                                th:value="${barbeiro.id}"
                                th:text="${barbeiro.nome}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group" id="datetime-group">
                <label for="dataHora">
                    <i class="fas fa-clock"></i> Data e Horário
                </label>
                <div class="input-container">
                    <i class="fas fa-calendar-alt input-icon"></i>
                    <input type="text"
                           id="dataHora"
                           name="dataHora"
                           th:value="*{dataHora}"
                           placeholder="Clique para selecionar"
                           required>
                </div>
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-check-circle"></i> Confirmar Agendamento
            </button>

            <div th:if="${erro}" class="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${erro}"></span>
            </div>

            <div th:if="${sucesso}" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span th:text="${sucesso}"></span>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    &copy; 2025 Barbearia Souza - Todos os direitos reservados
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
<script>
    // Flatpickr config
    flatpickr("#dataHora", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        minDate: "today",
        time_24hr: true,
        minuteIncrement: 30,
        locale: "pt",
        disable: [
            function(date) {
                return date.getDay() === 0; // Desativa domingos
            }
        ],
        disableMobile: true
    });

    // Form validation
    document.getElementById('appointment-form').addEventListener('submit', function(e) {
        const servico = document.getElementById('servico');
        const barbeiro = document.getElementById('barbeiro');
        const dataHora = document.getElementById('dataHora');

        let valid = true;

        if (servico.value === '') {
            servico.style.borderColor = '#dc3545';
            valid = false;
        } else {
            servico.style.borderColor = 'rgba(240, 179, 91, 0.2)';
        }

        if (barbeiro.value === '') {
            barbeiro.style.borderColor = '#dc3545';
            valid = false;
        } else {
            barbeiro.style.borderColor = 'rgba(240, 179, 91, 0.2)';
        }

        if (dataHora.value === '') {
            dataHora.style.borderColor = '#dc3545';
            valid = false;
        } else {
            dataHora.style.borderColor = 'rgba(240, 179, 91, 0.2)';
        }

        if (!valid) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
