<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Barbeiros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/cadastro-barbeiro.css">
</head>

<body>
<div th:replace="~{fragments/_navbar :: navbar}"></div>


<div class="container admin-container">
    <div class="admin-header">
      <h1 class="admin-title">
        <i class="fas fa-users-cog"></i> Gerenciamento de Barbeiros
      </h1>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i> <span th:text="${sucesso}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${erro}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="admin-content-wrapper">
      <!-- Formulário de Cadastro -->
      <div class="barber-form-container">
        <div class="barber-form card">
          <h2><i class="fas fa-user-plus"></i> Cadastrar Novo Barbeiro</h2>
          
          <form th:action="@{/admin/barbeiros/cadastrar}" th:object="${barbeiro}" method="post">
            <div class="form-group">
              <label for="nome" class="form-label">Nome do Barbeiro</label>
              <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
            </div>
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
              <label for="telefone" class="form-label">Telefone</label>
              <input type="text" class="form-control" id="telefone" th:field="*{telefone}" required>
            </div>
            <div class="form-group">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" th:field="*{senha}" required>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="ativo" th:field="*{ativo}">
              <label class="form-check-label" for="ativo">Ativo</label>
            </div>
            <button type="submit" class="btn btn-primary submit-btn">Cadastrar Barbeiro</button>
          </form>
        </div>
      </div>

      <!-- Lista de Barbeiros Cadastrados -->
      <div class="barber-list-container">
        <div class="barber-list card">
          <h3><i class="fas fa-list"></i> Barbeiros Cadastrados</h3>
          
          <div th:if="${barbeiros.empty}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> Nenhum barbeiro cadastrado ainda.
          </div>
          
          <div th:unless="${barbeiros.empty}">
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="barbeiro : ${barbeiros}">
                    <td th:text="${barbeiro.nome}"></td>
                    <td>
                      <span th:if="${barbeiro.ativo}" class="status-badge status-confirmado">
                        <i class="fas fa-check"></i> Ativo
                      </span>
                      <span th:unless="${barbeiro.ativo}" class="status-badge status-cancelado">
                        <i class="fas fa-times"></i> Inativo
                      </span>
                    </td>
                    <td>
                      <div class="table-actions">
                        <a th:href="@{/admin/barbeiros/toggle-status/{id}(id=${barbeiro.id})}" 
                           class="btn btn-sm status-toggle"
                           th:classappend="${!barbeiro.ativo} ? 'inactive' : ''">
                          <span th:text="${barbeiro.ativo} ? 'Desativar' : 'Ativar'"></span>
                        </a>
                        <a th:href="@{/admin/barbeiros/excluir/{id}(id=${barbeiro.id})}" 
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Tem certeza que deseja excluir este barbeiro?')">
                          <i class="fas fa-trash"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
