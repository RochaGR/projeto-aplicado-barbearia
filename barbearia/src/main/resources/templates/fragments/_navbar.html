<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Fragment da Navbar -->
<nav th:fragment="navbar" class="navbar">
    <a href="/" class="logo">
        <i class="fas fa-cut"></i>
        <span>Barbearia Souza</span>
    </a>

    <div class="nav-buttons" id="nav-buttons">
        <!-- Menu para usuários não logados -->
        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/clientes/login}" class="nav-btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            <a th:href="@{/clientes/cadastro}" class="nav-btn">
                <i class="fas fa-user-plus"></i> Cadastre-se
            </a>
        </div>

        <!-- Menu para clientes comuns -->
        <div sec:authorize="isAuthenticated() && !hasRole('ADMIN') && !hasRole('BARBEIRO')">
            <a th:href="@{/agendamentos/novo}" class="nav-btn">
                <i class="fas fa-plus"></i> Novo Agendamento
            </a>
            <a th:href="@{/agendamentos}" class="nav-btn">
                <i class="fas fa-calendar-check"></i> Meus Agendamentos
            </a>
            <a th:href="@{/cliente/historico}" class="nav-btn">
                <i class="fas fa-history"></i> Histórico
            </a>
            <a th:href="@{/cliente/fidelidade}" class="nav-btn">
                <i class="fas fa-star"></i> Fidelidade
            </a>
        </div>

        <!-- Menu para barbeiros -->
        <div sec:authorize="hasRole('BARBEIRO')">
            <a th:href="@{/agendamentos/barbeiro}" class="nav-btn">
                <i class="fas fa-calendar-check"></i> Agendamentos comigo
            </a>
            <a th:href="@{/agendamentos/novo}" class="nav-btn">
                <i class="fas fa-plus"></i> Novo Agendamento
            </a>
        </div>

        <!-- Menu para admin -->
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/dashboard}" class="nav-btn">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a th:href="@{/admin/todos-agendamentos}" class="nav-btn">
                <i class="fas fa-calendar-alt"></i> Todos Agendamentos
            </a>
            <a th:href="@{/admin/barbeiros}" class="nav-btn">
                <i class="fas fa-users"></i> Gerenciar Barbeiros
            </a>
            <a th:href="@{/admin/servicos}" class="nav-btn">
                <i class="fas fa-cut"></i> Gerenciar Serviços
            </a>
            <a th:href="@{/admin/fidelidade/config}" class="nav-btn">
                <i class="fas fa-cog"></i> Config. Fidelidade
            </a>
        </div>

        <!-- Botão de logout (comum a todos logados) -->
        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="nav-btn">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
