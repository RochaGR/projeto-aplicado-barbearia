<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Barbearia Souza</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Referencia CSS -->
  <link rel="stylesheet" href="/css/login.css">

</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="logo">
      <i class="fas fa-cut"></i>
      <span>Barbearia Souza</span>
    </a>
  </nav>
  
  <!-- Login Container -->
  <div class="login-container">
    <div class="login-header">
      <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
    </div>
    
    <div class="login-form">
      <div th:if="${erro}" class="error-message">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${erro}">Mensagem de erro</span>
      </div>
      
      <form th:action="@{/clientes/login}" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" name="username" placeholder="Seu email" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="senha" name="password" placeholder="Sua senha" required>
          </div>
        </div>
        
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>
      
      <div class="login-footer">
        Ainda não tem uma conta? <a th:href="@{/clientes/cadastro}">Cadastre-se</a>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    &copy; 2025 Barbearia Souza - Todos os direitos reservados
  </div>
</body>
<script src="/js/login.js"></script>
</html>
