<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin - Agendamentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin-agendamento.css}">
</head>
<body>
<div class="container">

    <div th:replace="~{fragments/_navbar :: navbar}"></div>


    <main class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title"><i class="fas fa-calendar-alt"></i> Gerenciamento de Agendamentos</h1>
        </div>

        <!-- Mensagens de Feedback -->
        <div th:if="${sucesso}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${sucesso}"></span>
        </div>

        <div th:if="${erro}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${erro}"></span>
        </div>

        <!-- Filtros -->
        <div class="filtros">
            <input type="date"
                   id="dataFiltro"
                   class="filtro-input"
                   th:value="${dataFiltro != null ? dataFiltro : ''}">
            <select id="statusFiltro" class="filtro-input">
                <option value="">Todos os Status</option>
                <option value="AGENDADO" th:selected="${statusFiltro == 'AGENDADO'}">Agendado</option>
                <option value="CONFIRMADO" th:selected="${statusFiltro == 'CONFIRMADO'}">Confirmado</option>
                <option value="CONCLUIDO" th:selected="${statusFiltro == 'CONCLUIDO'}">Concluído</option>
                <option value="CANCELADO" th:selected="${statusFiltro == 'CANCELADO'}">Cancelado</option>
            </select>
            <button class="btn" onclick="filtrarAgendamentos()">
                <i class="fas fa-filter"></i> Filtrar
            </button>
            <button class="btn" onclick="limparFiltros()">
                <i class="fas fa-times"></i> Limpar
            </button>
            <button class="btn" onclick="filtrarHoje()">
                <i class="fas fa-calendar-day"></i> Hoje
            </button>
        </div>

        <div class="agendamentos-table">
            <div th:if="${agendamentos == null or #lists.isEmpty(agendamentos)}" class="alert alert-info">
                <i class="fas fa-info-circle"></i> Nenhum agendamento encontrado com os filtros aplicados.
            </div>

            <table th:if="${agendamentos != null and !#lists.isEmpty(agendamentos)}">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Data/Hora</th>
                    <th>Cliente</th>
                    <th>Telefone</th>
                    <th>Barbeiro</th>
                    <th>Serviço</th>
                    <th>Preço</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="agendamento : ${agendamentos}">
                    <td th:text="${agendamento.id}"></td>
                    <td th:text="${agendamento.dataHora != null ? #temporals.format(agendamento.dataHora, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                    <td th:text="${agendamento.cliente != null ? agendamento.cliente.nome : 'N/A'}"></td>
                    <td th:text="${agendamento.cliente != null ? agendamento.cliente.telefone : 'N/A'}"></td>
                    <td th:text="${agendamento.barbeiro != null ? agendamento.barbeiro.nome : 'N/A'}"></td>
                    <td th:text="${agendamento.servico != null ? agendamento.servico.nome : 'N/A'}"></td>
                    <td th:text="${agendamento.servico != null ? 'R$ ' + #numbers.formatDecimal(agendamento.servico.preco, 1, 2) : 'N/A'}"></td>
                    <td>
            <span th:class="'status-badge status-' + ${agendamento.status.toLowerCase()}"
                  th:text="${agendamento.status}"></span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <form th:action="@{/admin/agendamentos/confirmar/{id}(id=${agendamento.id})}"
                                  method="post"
                                  th:if="${agendamento.status == 'AGENDADO'}"
                                  style="display: inline;"
                                  onsubmit="return confirmarAcao(event, this, 'confirmar')">
                                <button type="submit" class="action-btn confirm" title="Confirmar Agendamento">
                                    <i class="fas fa-check"></i>
                                </button>
                            </form>

                            <form th:action="@{/admin/agendamentos/cancelar/{id}(id=${agendamento.id})}"
                                  method="post"
                                  th:if="${agendamento.status == 'AGENDADO' or agendamento.status == 'CONFIRMADO'}"
                                  style="display: inline;"
                                  onsubmit="return confirmarAcao(event, this, 'cancelar')">
                                <button type="submit" class="action-btn cancel" title="Cancelar Agendamento">
                                    <i class="fas fa-times"></i>
                                </button>
                            </form>

                            <span th:if="${agendamento.status == 'CANCELADO' or agendamento.status == 'CONCLUIDO'}"
                                  class="text-muted" style="font-size: 12px;">
                Nenhuma ação disponível
              </span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    function filtrarAgendamentos() {
        const data = document.getElementById('dataFiltro').value;
        const status = document.getElementById('statusFiltro').value;

        let url = '/admin/todos-agendamentos?';
        if (data) url += `data=${data}&`;
        if (status) url += `status=${status}`;

        url = url.endsWith('&') || url.endsWith('?') ? url.slice(0, -1) : url;
        window.location.href = url;
    }

    function limparFiltros() {
        window.location.href = '/admin/todos-agendamentos';
    }

    function filtrarHoje() {
        const hoje = new Date().toISOString().split('T')[0];
        window.location.href = '/admin/todos-agendamentos?data=' + hoje;
    }

    function confirmarAcao(event, form, acao) {
        event.preventDefault();

        const mensagens = {
            'confirmar': 'Tem certeza que deseja confirmar este agendamento?',
            'cancelar': 'Tem certeza que deseja cancelar este agendamento?'
        };

        if (confirm(mensagens[acao])) {
            form.submit();
        }

        return false;
    }

    // Auto-ocultar mensagens após 5 segundos
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert-success, .alert-danger');
        alerts.forEach(alert => {
            alert.style.transition = 'opacity 0.5s';
            alert.style.opacity = '0';
            setTimeout(() => alert.remove(), 500);
        });
    }, 5000);
</script>
</body>
</html>
