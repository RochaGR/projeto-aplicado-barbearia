# =============================================
# PROFILE: prod
# Ativar com: --spring.profiles.active=prod
# Requer arquivo .env no WorkingDirectory
# =============================================

# Google OAuth2 - redirect URI exata do Google Cloud Console
spring.security.oauth2.client.registration.google.redirect-uri=http://168.138.147.219.nip.io/login/oauth2/code/google

# Redirect pós-login OAuth2 (para onde o backend redireciona o navegador)
app.oauth2.redirect-uri=http://168.138.147.219.nip.io
app.url=http://168.138.147.219.nip.io

# Trust forwarded headers do Nginx (Host, X-Forwarded-*, etc)
server.forward-headers-strategy=framework

# Cookie de sessão - HTTP (sem HTTPS), SameSite=Lax para permitir navegação
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
