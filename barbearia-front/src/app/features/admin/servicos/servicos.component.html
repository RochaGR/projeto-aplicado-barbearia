<div class="page page--wide">
  <h1 class="page__title">Serviços</h1>

  <div class="surface form-block">
    <h2>Novo serviço</h2>
    <form class="form-grid" (ngSubmit)="cadastrar()">
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" [(ngModel)]="nome" required />
      </div>
      <div class="field field--wide">
        <label for="desc">Descrição</label>
        <input id="desc" name="desc" type="text" [(ngModel)]="descricao" required />
      </div>
      <div class="field">
        <label for="preco">Preço (R$)</label>
        <input id="preco" name="preco" type="number" step="0.01" min="0" [(ngModel)]="preco" required />
      </div>
      <div class="field">
        <label for="dur">Duração (min)</label>
        <input id="dur" name="dur" type="number" min="1" [(ngModel)]="duracaoMinutos" required />
      </div>
      <div class="field field--check">
        <label>
          <input type="checkbox" [(ngModel)]="ativo" name="ativo" />
          Ativo
        </label>
      </div>
      <div class="field field--action">
        <button type="submit" class="btn-brand" [disabled]="criando()">
          {{ criando() ? 'Salvando…' : 'Cadastrar' }}
        </button>
      </div>
    </form>
  </div>

  @if (erro()) {
    <div class="alert alert--err">{{ erro() }}</div>
  }

  @if (carregando()) {
    <p class="muted">Carregando…</p>
  } @else {
    <div class="table-wrap surface">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Duração</th>
            <th>Ativo</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (s of lista(); track s.id) {
            <tr>
              <td>
                <strong>{{ s.nome }}</strong>
                <p class="sub">{{ s.descricao }}</p>
              </td>
              <td>{{ s.preco | number: '1.2-2' }} R$</td>
              <td>{{ s.duracaoMinutos }} min</td>
              <td>{{ s.ativo ? 'Sim' : 'Não' }}</td>
              <td class="actions">
                <button
                  type="button"
                  class="btn-ghost btn-danger-ghost btn--sm"
                  [disabled]="acaoId() === s.id"
                  (click)="excluir(s)"
                >
                  Excluir
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
