<div class="page page--narrow">
  <h1 class="page__title">Entrar</h1>
  <p class="lead">Acesse sua conta.</p>

  <form class="surface card" [formGroup]="form" (ngSubmit)="entrar()">
    @if (erro()) {
      <div class="alert alert--err" role="alert">{{ erro() }}</div>
    }
    <div class="field" [class.field--invalid]="controlInvalid('email')">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      @if (controlInvalid('email')) {
        <small class="field-error">{{ controlMessage('email') }}</small>
      }
    </div>
    <div class="field" [class.field--invalid]="controlInvalid('senha')">
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        formControlName="senha"
        autocomplete="current-password"
      />
      @if (controlInvalid('senha')) {
        <small class="field-error">{{ controlMessage('senha') }}</small>
      }
    </div>
    <button type="submit" class="btn-brand btn-block" [disabled]="carregando() || form.invalid">
      {{ carregando() ? 'Entrando…' : 'Entrar' }}
    </button>
    <p class="foot">
      Não tem conta?
      <a routerLink="/cadastro">Cadastre-se</a>
    </p>
  </form>
</div>
